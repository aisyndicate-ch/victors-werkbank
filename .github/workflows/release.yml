name: Release
# A signed version tag (git tag -s vX.Y.Z) builds the wheel and the sdist, their
# checksums, a software bill of materials and a build provenance attestation,
# and opens a draft release that the maintainers publish after checking it.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the hash-locked build tools
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --require-hashes --index-url https://pypi.org/simple -r requirements-dev.txt
      - name: Check that the tag names the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(.venv/bin/python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$TAG" = "v$version"
      - name: Build the wheel and the sdist
        run: .venv/bin/python -m build --no-isolation
      - name: Write the software bill of materials
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Write the checksums
        run: (cd dist && sha256sum -- * > SHA256SUMS)
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
  draft-release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Open a draft release with the files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$TAG" --notes "To install without git: check the sdist against SHA256SUMS (SECURITY.md, Release files), unpack it and run ./werkbank in the unpacked folder. See CHANGELOG.md."
