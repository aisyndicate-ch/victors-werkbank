version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # The CodeQL steps of one workflow must run one version, so they update together.
    groups:
      codeql-action:
        patterns: ["github/codeql-action/*"]
    # The image of scorecard-action 2.6.0 fails to pull on GitHub's runners
    # ("manifest unknown"), so that version is skipped.
    ignore:
      - dependency-name: ossf/scorecard-action
        versions: ["2.6.0"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
